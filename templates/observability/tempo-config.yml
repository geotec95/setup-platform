# templates/observability/tempo-config.yml
# Config do Grafana Tempo (tracing distribuído) em modo single-binary,
# armazenamento local em filesystem — mesmo padrão adotado pelo Loki neste
# projeto (adequado para o volume de um único servidor de cliente). Copiada
# para /data/observability/config/tempo/tempo-config.yml pelo install.sh.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h  # 14 dias

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Habilita "TraceQL metrics" (quantile_over_time, rate, etc. direto sobre os
# spans já armazenados, sem precisar de um Prometheus remote-write separado
# nem de Kafka) -- usado pelos painéis de latência p95 e taxa de erro por
# endpoint na aba Traces do dashboard de cliente.
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]

metrics_generator:
  processor:
    local_blocks:
      flush_to_storage: true
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
