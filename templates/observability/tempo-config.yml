# templates/observability/tempo-config.yml
# Config do Grafana Tempo (tracing distribuído) em modo single-binary,
# armazenamento local em filesystem — mesmo padrão adotado pelo Loki neste
# projeto (adequado para o volume de um único servidor de cliente). Copiada
# para /data/observability/config/tempo/tempo-config.yml pelo install.sh.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h  # 14 dias

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
