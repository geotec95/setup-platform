# templates/observability/promtail-config.yml
# Config do Promtail: descobre containers via Docker SD (usando o socket
# montado read-only) e lê os arquivos de log JSON que o Docker grava em
# /var/lib/docker/containers/<id>/<id>-json.log (também montado read-only
# no container do Promtail). Copiada para
# /data/observability/config/promtail/promtail-config.yml pelo install.sh.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containerlogs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # job_name NÃO vira label "job" automaticamente em docker_sd_configs
      # (diferente do Prometheus) — precisa ser setado explicitamente aqui,
      # senão dashboards que filtram por job="containerlogs" ficam vazios.
      - target_label: job
        replacement: containerlogs
      # Nome do container (remove a barra inicial do Docker)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # Nome do serviço Swarm, quando aplicável (permite filtrar por stack no Grafana)
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: swarm_service
      # stdout/stderr
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      # Sem isso, cada linha empurrada pro Loki é o envelope JSON bruto do
      # Docker ({"log":"...","stream":"stdout","time":"..."}) em vez do
      # conteúdo real do log da aplicação — o stage "docker" desembrulha isso
      # e usa o "time" do próprio Docker como timestamp da entrada.
      - docker: {}
      # Heurística simples de nível de log: funciona pra qualquer app (não dá
      # pra exigir um formato estruturado específico de cada cliente), só
      # procura a palavra de nível em qualquer lugar da linha. Vira label
      # "level", usado pelo alerta de taxa de erro e pra filtro no Grafana.
      - regex:
          expression: '(?i)\b(?P<level>trace|debug|info|warn(?:ing)?|error|fatal|panic|critical)\b'
      - template:
          source: level
          template: '{{ ToLower .Value | replace "warning" "warn" | replace "critical" "error" | replace "panic" "fatal" }}'
      - labels:
          level:
