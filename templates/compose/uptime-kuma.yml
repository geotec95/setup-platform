version: "3.8"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    networks:
      - rede_publica
    environment:
      - TZ=${TZ}
    volumes:
      - /data/uptime-kuma:/app/data
    # Sem `healthcheck:` aqui de propósito: a imagem já traz um HEALTHCHECK
    # embutido no Dockerfile (script próprio `extra/healthcheck`, não depende
    # de wget/curl) — sobrescrever com um comando externo pode quebrar se o
    # binário não existir na imagem (mesmo problema visto no Loki).
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
        - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      placement:
        constraints:
          - node.role == manager

networks:
  rede_publica:
    external: true
